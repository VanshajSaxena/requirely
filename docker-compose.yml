# Postgres for local development and integration tests.
#
# Image note: this is the pgvector build rather than stock postgres. The extension
# is not enabled in v1, but starting here means adding retrieval later is a
# migration rather than an image swap and data reload.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: requirely-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: requirely
      POSTGRES_PASSWORD: requirely
      POSTGRES_DB: requirely
    ports:
      # Host port is configurable because 5432 is frequently already taken by a
      # native Postgres — on this repo's first real machine it was a NixOS
      # systemd service bound to 127.0.0.1:5432, which makes the container's
      # 0.0.0.0:5432 bind fail with EADDRINUSE. The default is unchanged, so
      # nothing moves for anyone who has the port free; set REQUIRELY_DB_PORT in
      # .env (which compose reads from this directory) when it is not.
      - "${REQUIRELY_DB_PORT:-5432}:5432"
    volumes:
      - requirely-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requirely -d requirely"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  requirely-pgdata:
